name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0
      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install test dependencies
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps --only-shell chromium
      - name: Verify release
        run: npm run verify:release
        env:
          TMPDIR: ${{ runner.temp }}
      - name: Upload failed browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-test-failures
          path: ${{ runner.temp }}/bandit-browser-*/
          if-no-files-found: ignore
          retention-days: 7
      - name: Prepare static files
        run: |
          mkdir -p _site
          cp index.html mac.html manifest.webmanifest sw.js sitemap.xml robots.txt .nojekyll _site/
          cp -R assets _site/assets
          mkdir -p _site/launcher
          cp launcher/prepare-macos.py _site/launcher/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static site
        id: deployment
        uses: actions/deploy-pages@v5.0.1
